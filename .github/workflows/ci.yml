name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.11"
  CI: "1"
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZSQ"
  NEXT_PUBLIC_COUCOU_BASE_URL: "https://coucou.events"
  NEXT_PUBLIC_COUCOU_CLERK_ORGANIZATION_SLUG: "coucou"
  NEXT_PUBLIC_DOJO_CLERK_ORGANIZATION_ID: "org_dojo"
  NEXT_PUBLIC_CLUB_CHLORINE_CLERK_ORGANIZATION_ID: "org_club_chlorine"
  NEXT_PUBLIC_DANZA_ORGANICA_CLERK_ORGANIZATION_ID: "org_danza_organica"

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Biome
            script: check
          - name: Tests
            script: test
          - name: Build
            script: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - name: Run ${{ matrix.name }}
        run: bun run ${{ matrix.script }}

  static-checks:
    name: Static Checks
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI check
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = "success"
